name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Licence gate unit tests
        run: ./gradlew :app:testDebugUnitTest --tests "com.herowalls.app.LicensePolicyTest" --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeroWalls-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: HeroWalls v1.0.0
          body: |
            **HeroWalls** - premium superhero wallpapers for Android.

            Download `app-debug.apk` below and install it on any Android 7.0+ device.
            Every wallpaper is fetched live from Wikimedia Commons under a verified free licence
            (Public Domain, CC0, CC BY, CC BY-SA), with creator and licence shown on every image.
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
