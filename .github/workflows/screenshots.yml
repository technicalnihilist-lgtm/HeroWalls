name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/screenshots/**'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            mkdir -p docs/screenshots
            adb shell am start -n com.herowalls.app.debug/com.herowalls.app.MainActivity
            sleep 45
            adb exec-out screencap -p > docs/screenshots/01-home.png
            adb shell input swipe 540 1800 540 700 400
            sleep 6
            adb exec-out screencap -p > docs/screenshots/02-collections.png
            adb shell input swipe 540 1800 540 700 400
            sleep 4
            adb shell input tap 300 1200
            sleep 12
            adb exec-out screencap -p > docs/screenshots/03-detail.png
            adb shell input keyevent KEYCODE_BACK
            sleep 3
            adb shell input tap 400 2250
            sleep 4
            adb shell input tap 540 300
            adb shell input text "Spider-Man"
            adb shell input keyevent KEYCODE_ENTER
            sleep 18
            adb exec-out screencap -p > docs/screenshots/04-search.png
            adb shell input tap 660 2250
            sleep 5
            adb exec-out screencap -p > docs/screenshots/05-saved.png
            adb shell input tap 850 2250
            sleep 5
            adb exec-out screencap -p > docs/screenshots/06-offline.png
            ls -la docs/screenshots
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --quiet --cached || git commit -m "docs: update app screenshots from emulator run"
          git push || echo "nothing to push"
